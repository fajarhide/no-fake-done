<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#F4F1EA;--ink:#1B1B1B;--green:#0B6B4F;--red:#C2362B;--mute:#6B675E}
body{width:1600px;background:#181715;padding:56px 56px 48px;font-family:Inter,sans-serif;color:var(--ink);
  background-image:radial-gradient(circle,#ffffff14 2px,transparent 3px);background-size:40px 40px}
.kicker{font:600 18px 'IBM Plex Mono',monospace;letter-spacing:4px;color:#9b968a;text-transform:uppercase}
h1{font:600 46px Newsreader,serif;color:var(--paper);margin-top:10px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:var(--cols,1fr 1fr);gap:40px;margin-top:36px}
.side{background:var(--paper);border-radius:14px;padding:22px 22px 24px;position:relative;box-shadow:0 18px 50px #0007}
.stamp{display:inline-block;font:600 17px 'IBM Plex Mono',monospace;letter-spacing:3px;padding:7px 14px;border:3px solid;border-radius:8px;transform:rotate(-2deg);margin-bottom:16px}
.bad .stamp{color:var(--red);border-color:var(--red)} .good .stamp{color:var(--green);border-color:var(--green)}
.win{border-radius:10px;overflow:hidden;border:1px solid #1b1b1b22;background:#fff;position:relative}
.bar{height:34px;background:#e9e6de;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid #1b1b1b18}
.bar i{width:11px;height:11px;border-radius:50%;background:#cfcabd}
.bar span{margin-left:12px;font:500 13px 'IBM Plex Mono',monospace;color:var(--mute);background:#f6f4ee;border-radius:6px;padding:3px 10px}
.shot{position:relative;width:100%}
.shot img{display:block;width:100%}
.mark{position:absolute;border:3px solid;border-radius:8px}
.dot{position:absolute;width:30px;height:30px;border-radius:50%;color:#fff;font:600 16px Inter;display:grid;place-items:center;box-shadow:0 2px 6px #0004}
.bad .mark{border-color:var(--red)} .bad .dot{background:var(--red)}
.good .mark{border-color:var(--green)} .good .dot{background:var(--green)}
ol{list-style:none;margin-top:18px;display:grid;gap:10px}
li{display:flex;gap:12px;align-items:flex-start;font-size:19px;line-height:1.38}
li b{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font:600 14px Inter;display:grid;place-items:center;margin-top:1px}
.bad li b{background:var(--red)} .good li b{background:var(--green)}
.rows{padding:6px 0;background:#fff}
.row{display:flex;gap:14px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid #1b1b1b10;font:500 17px/1.4 'IBM Plex Mono',monospace}
.row:last-child{border-bottom:0}
.row b{flex:none;width:24px;height:24px;border-radius:6px;color:#fff;display:grid;place-items:center;font:600 15px Inter}
.row.ok b{background:var(--green)} .row.no b{background:var(--red)}
.row small{display:block;font:400 15px Inter;color:var(--mute);margin-top:2px}
.total{margin-top:16px;font:600 30px Newsreader,serif}
.foot{margin-top:26px;font:500 15px 'IBM Plex Mono',monospace;color:#9b968a;display:flex;justify-content:space-between}
</style></head><body>
<div class="kicker" id="kicker"></div>
<h1 id="title"></h1>
<div class="grid" id="grid"></div>
<div class="foot"><span id="foot"></span><span>fajarhide/no-fake-done</span></div>
<script>
const C = JSON.parse(decodeURIComponent(location.hash.slice(1)));
document.getElementById('kicker').textContent = C.kicker;
document.getElementById('title').textContent = C.title;
document.getElementById('foot').textContent = C.foot;
if (C.narrow) { document.body.style.width = '1200px'; }
for (const s of C.sides) {
  const W = s.w || 1280, H = s.h || 800;  // the screenshot's own size; marks are given in its pixels
  const el = document.createElement('div');
  el.className = 'side ' + s.kind;
  const marks = (s.marks || []).map((m, i) => {
    const [x, y, w, h] = m.box;
    const L = v => (v / W * 100) + '%', T = v => (v / H * 100) + '%';
    // the ring sits just outside the area and the number to its left, so neither covers the text
    return `<div class="mark" style="left:calc(${L(x)} - 4px);top:calc(${T(y)} - 4px);width:calc(${L(w)} + 8px);height:calc(${T(h)} + 8px)"></div>` +
      `<div class="dot" style="left:${m.dot === 'right' ? `calc(${L(x + w)} + 10px)` : `calc(${L(x)} - 40px)`};top:calc(${T(y + h / 2)} - 15px)">${i + 1}</div>`;
  }).join('');
  if (s.rows) {
    el.innerHTML = `<div class="stamp">${s.stamp}</div>
      <div class="win"><div class="bar"><i></i><i></i><i></i><span>${s.bar || 'localhost:3000'}</span></div>
      <div class="rows">${s.rows.map(r => `<div class="row ${r.ok ? 'ok' : 'no'}"><b>${r.ok ? '✓' : '✗'}</b><span>${r.text}${r.note ? `<small>${r.note}</small>` : ''}</span></div>`).join('')}</div></div>
      <div class="total">${s.total || ''}</div>`;
    document.getElementById('grid').appendChild(el);
    continue;
  }
  el.innerHTML = `<div class="stamp">${s.stamp}</div>
    <div class="win"><div class="bar"><i></i><i></i><i></i><span>localhost:3000</span></div>
    <div class="shot"><img src="${s.img}">${marks}</div></div>
    <ol>${s.marks.map((m, i) => `<li><b>${i + 1}</b><span>${m.text}</span></li>`).join('')}</ol>`;
  document.getElementById('grid').appendChild(el);
}
</script>
</body></html>
